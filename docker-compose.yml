services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: talmicahel-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - talmicahel-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talmicahel-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8050:8000"       # host:container — access on http://localhost:8050
    networks:
      - talmicahel-net
    env_file:
      - .env              # local .env file loaded first
    environment:
      # MongoDB — overrides .env so the container uses the internal service name
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=${MONGODB_DB:-talmicahel}

      # Auth
      - SECRET_KEY=${SECRET_KEY:-talmicahel_jwt_secret_key_32chars_min}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}

      # AI — all optional, features degrade gracefully if not set
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}

      # App
      - DEBUG=${DEBUG:-false}

    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=8).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  talmicahel-net:
    driver: bridge